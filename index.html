<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>딱 한 곡만</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><div class="room-mark" aria-hidden="true"><i></i><i></i><i></i></div><div class="sound"><button id="mute" aria-label="음소거 전환"></button><input id="volume" aria-label="볼륨" type="range" min="0" max="100" value="35"></div></header>
<section class="screen"><canvas id="game" width="1200" height="650" aria-label="연습실 리듬 게임. Space로 연주, P로 일시정지"></canvas><div id="camera" role="img" aria-label="감시 상태"></div><div id="judge" role="status" aria-live="polite"></div><div id="overlay"><div id="vignette" aria-hidden="true"></div><div id="chapters" aria-hidden="true"></div><button id="next" aria-label="다음 장면"></button><button id="skip" aria-label="도입 건너뛰기"></button></div></section>
<footer><div class="meters"><div id="score" class="meter" role="img" aria-label="점수"></div><div id="combo" class="meter combo" role="img" aria-label="연속 성공"></div><div id="caught" role="img" aria-label="들킴 횟수"></div></div><div class="controls"><button id="pause" aria-label="일시정지"></button><button id="restart" aria-label="처음부터"></button></div></footer><div class="progress" role="img" aria-label="곡 진행"><div id="progress"></div></div></main><script src="game.js"></script></body></html>
